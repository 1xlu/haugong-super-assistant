<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>窝工大学生超级助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; padding: 20px; }
        h1 { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 30px; color: #2c3e50; font-size: 28px; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 800; }
        h1 img { width: 60px; height: 60px; object-fit: contain; }
        
        .container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1200px; margin: 0 auto; }
        @media (max-width: 1024px) { .container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .card h2 { display: flex; align-items: center; gap: 10px; font-size: 18px; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; color: #3498db; }
        .card h2 img { width: 36px; height: 36px; object-fit: contain; border-radius: 8px; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input[type="text"], input[type="number"], input[type="date"], input[type="datetime-local"] { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 5px; outline: none; min-width: 80px; }
        button { padding: 8px 15px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #2980b9; }

        .filter-group { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
        .filter-btn { padding: 5px 10px; font-size: 12px; background-color: #ecf0f1; color: #7f8c8d; border: 1px solid #bdc3c7; }
        .filter-btn:hover { background-color: #e0e6ed; }
        .filter-btn.active { background-color: #27ae60; color: white; border-color: #27ae60; }
        .filter-group.expense-filters .filter-btn.active { background-color: #3498db; border-color: #3498db; }
        .filter-group.word-filters .filter-btn.active { background-color: #8e44ad; border-color: #8e44ad; }

        ul { list-style: none; flex-grow: 1; overflow-y: auto; max-height: 200px; }
        .date-group { margin-bottom: 15px; }
        .date-title { font-size: 13px; color: #7f8c8d; font-weight: bold; margin-bottom: 5px; border-left: 3px solid #3498db; padding-left: 5px; }
        li { padding: 8px 10px; border-bottom: 1px dashed #eee; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .todo-done { text-decoration: line-through; color: #aaa; }
        
        .delete-btn { color: #e74c3c; cursor: pointer; font-size: 12px; background: none; border: none; padding: 4px 8px; border-radius: 3px; }
        .delete-btn:hover { background: #ffeaea; }
        
        .total-money { font-size: 20px; font-weight: bold; color: #e74c3c; margin-bottom: 5px; }
        .filtered-money { font-size: 14px; color: #d35400; margin-bottom: 10px; font-weight: bold; }
        
        .emoji-picker { display: flex; gap: 10px; margin-bottom: 10px; font-size: 20px; }
        .emoji-picker span { cursor: pointer; transition: transform 0.1s; }
        .emoji-picker span:hover { transform: scale(1.3); }
        
        .msg-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; gap: 12px; align-items: flex-start; }
        .msg-emoji { font-size: 24px; }
        .msg-time { font-size: 12px; color: #aaa; margin-top: 5px; }

        .timer-log-header { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: #7f8c8d; border-top: 1px dashed #eee; padding-top: 8px; }
        .clear-log-btn { background: none; color: #e74c3c; border: none; font-size: 12px; padding: 2px 6px; cursor: pointer; }
        .clear-log-btn:hover { text-decoration: underline; }
        #pomodoroLogs { font-size: 12px; color: #7f8c8d; margin-top: 5px; max-height: 80px; overflow-y: auto; line-height: 1.5; }

        .food-log-section { margin-top: 10px; border-top: 1px dashed #eee; padding-top: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .food-log-title { font-size: 14px; font-weight: bold; color: #2c3e50; margin-bottom: 8px; }
        .food-log-list { max-height: 120px; overflow-y: auto; }
        .food-log-item { font-size: 13px; color: #555; padding: 6px 0; border-bottom: 1px dashed #f0f0f0; display: flex; justify-content: space-between; align-items: center; }

        .history-list { font-size: 13px; color: #555; max-height: 130px; overflow-y: auto; margin-top: 10px; }
        .history-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #eee; }

        .exam-item { display: flex; flex-direction: column; padding: 10px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
        .exam-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .exam-name { font-weight: bold; color: #2c3e50; font-size: 15px; }
        .exam-time { font-size: 12px; color: #7f8c8d; }
        .exam-countdown { font-size: 16px; font-weight: bold; color: #e74c3c; }
        .exam-countdown.expired { color: #95a5a6; }

        .word-display-box { text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; min-height: 120px; }
    </style>
</head>
<body>

    <h1>
        <img src="./images/logo.png" alt="校徽" onerror="this.style.display='none'">
        窝工大学生超级助手
    </h1>

    <div class="container">
        <!-- 1. 待办清单 -->
        <div class="card">
            <h2><img src="./images/1.png" alt="图1" onerror="this.style.display='none'"> 今日计划</h2>
            <div class="input-group">
                <input type="text" id="todoInput" placeholder="准备做什么？">
                <input type="date" id="todoDate" style="flex: 0.6;">
                <button onclick="addTodo()">添加</button>
            </div>
            <div id="todoContainer"></div>
        </div>

        <!-- 2. 记账本 -->
        <div class="card">
            <h2><img src="./images/2.png" alt="图2" onerror="this.style.display='none'"> 开销记录</h2>
            <div class="total-money">总计: ￥<span id="totalExpense">0</span></div>
            <div class="filter-group expense-filters">
                <button class="filter-btn active" onclick="setFilter('all', this)">全部</button>
                <button class="filter-btn" onclick="setFilter('week', this)">近一周</button>
                <button class="filter-btn" onclick="setFilter('month', this)">近一月</button>
                <button class="filter-btn" onclick="setFilter('halfYear', this)">近半年</button>
                <button class="filter-btn" onclick="setFilter('year', this)">近一年</button>
            </div>
            <div class="filtered-money">筛选区间总计: ￥<span id="filteredExpense">0</span></div>
            <div class="input-group">
                <input type="text" id="expenseName" placeholder="买什么？">
                <input type="number" id="expenseAmount" placeholder="金额" style="flex: 0.5;">
                <input type="date" id="expenseDate" style="flex: 0.7;">
                <button onclick="addExpense()">记账</button>
            </div>
            <div id="expenseContainer"></div>
        </div>

        <!-- 3. 碎碎念 -->
        <div class="card">
            <h2><img src="./images/3.png" alt="图3" onerror="this.style.display='none'"> 碎碎念心情</h2>
            <div class="emoji-picker" id="emojiPicker">
                <span onclick="selectEmoji('😄', this)">😄</span>
                <span onclick="selectEmoji('😢', this)">😢</span>
                <span onclick="selectEmoji('😡', this)">😡</span>
                <span onclick="selectEmoji('😴', this)">😴</span>
                <span onclick="selectEmoji('🤯', this)">🤯</span>
                <span onclick="selectEmoji('🥰', this)">🥰</span>
            </div>
            <div class="input-group">
                <input type="text" id="msgText" placeholder="今天发生了什么？">
                <button onclick="addMessage()">发送</button>
            </div>
            <div id="messageList" style="max-height: 150px; overflow-y: auto;"></div>
        </div>

        <!-- 4. 专注番茄钟 -->
        <div class="card">
            <h2><img src="./images/4.png" alt="图4" onerror="this.style.display='none'"> 专注番茄钟</h2>
            <div class="input-group" style="margin-bottom: 10px;">
                <input type="number" id="customMinutes" placeholder="分钟数" min="1">
                <button onclick="setPomodoroTime()">设定</button>
                <button onclick="resetCurrentTimer()" style="background-color: #e67e22;">重置</button>
            </div>
            <div style="text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
                <h1 id="timerDisplay" style="font-size: 40px; color: #e74c3c; margin: 5px 0; display: block; background: none; -webkit-text-fill-color: #e74c3c;">25:00</h1>
                <button onclick="startTimer()" id="timerBtn">开始专注</button>
            </div>
            <div class="timer-log-header">
                <span>历史记录</span>
                <button class="clear-log-btn" onclick="clearPomodoroLogs()">清空历史</button>
            </div>
            <div id="pomodoroLogs"></div>
        </div>

        <!-- 5. 今天吃什么 & 伙食记录 -->
        <div class="card">
            <h2><img src="./images/5.png" alt="图5" onerror="this.style.display='none'"> 今天吃什么</h2>
            <div class="filter-group">
                <button class="filter-btn active" onclick="setCampus('五山', this)">五山</button>
                <button class="filter-btn" onclick="setCampus('大学城', this)">大学城</button>
                <button class="filter-btn" onclick="setCampus('国际', this)">国际校区</button>
            </div>
            <div style="text-align: center; margin-bottom: 10px;">
                <h2 id="foodResult" style="margin: 10px 0; color: #27ae60; border: none; display: block; font-size: 20px;">点击抽取</h2>
                <button onclick="pickFood()" style="width: 100%; background-color: #27ae60;">随机决定</button>
            </div>
            <div class="food-log-section">
                <div class="food-log-title">🍱 伙食打卡（今日记录）</div>
                <div class="input-group" style="margin-bottom: 10px;">
                    <input type="text" id="mealInput" placeholder="吃了什么？">
                    <button onclick="addMealLog()">打卡</button>
                </div>
                <div class="food-log-list" id="mealLogList"></div>
            </div>
        </div>

        <!-- 6. 加权成绩计算器 -->
        <div class="card">
            <h2><img src="./images/6.png" alt="图6" onerror="this.style.display='none'"> 成绩计算器</h2>
            <div class="input-group">
                <input type="text" id="courseName" placeholder="课程名" style="flex: 1.2;">
                <input type="number" id="creditInput" placeholder="学分" style="flex: 0.5;">
                <input type="number" id="scoreInput" placeholder="分数" style="flex: 0.5;">
                <button onclick="addCourse()">添加</button>
            </div>
            <div id="courseList" class="history-list"></div>
            <div class="total-money" style="font-size: 14px; margin-top: auto; border-top: 1px solid #eee; padding-top: 10px; display: flex; justify-content: space-between;">
                <span>总学分: <span id="totalCredits" style="color: #333;">0</span></span>
                <span>加权分: <span id="weightedAvg">0.00</span></span>
                <span style="color: #8e44ad; font-weight: bold;">华工GPA: <span id="gpaDisplay">0.00</span></span>
            </div>
        </div>

        <!-- 7. 喝水打卡 -->
        <div class="card">
            <h2><img src="./images/7.png" alt="图7" onerror="this.style.display='none'"> 喝水打卡</h2>
            <div style="text-align: center; margin-bottom: 10px;">
                <h1 id="waterCount" style="font-size: 40px; color: #3498db; margin: 10px 0; display: block; background: none; -webkit-text-fill-color: #3498db;">0</h1>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button onclick="changeWater(1)" style="background-color: #3498db;">喝水 +1</button>
                    <button onclick="changeWater(-1)" style="background-color: #95a5a6;">点错了 -1</button>
                </div>
            </div>
            <div class="food-log-title" style="margin-top: 10px; border-top: 1px dashed #eee; padding-top: 10px;">💧 历史喝水记录</div>
            <div id="waterLogList" class="history-list" style="max-height: 110px;"></div>
        </div>

        <!-- 8. 考试倒计时 -->
        <div class="card">
            <h2><img src="./images/8.png" alt="图8" onerror="this.style.display='none'"> 考试倒计时</h2>
            <div class="input-group">
                <input type="text" id="examName" placeholder="科目 (如: 高数)" style="flex: 1;">
                <input type="datetime-local" id="examTime" style="flex: 1.2;">
                <button onclick="addExam()">添加</button>
            </div>
            <div id="examList" class="history-list" style="max-height: 220px;"></div>
        </div>

        <!-- 9. 随机背单词 -->
        <div class="card">
            <h2><img src="./images/9.png" alt="图9" onerror="this.style.display='none'"> 随机背单词</h2>
            <div class="filter-group word-filters">
                <button class="filter-btn active" onclick="setWordLevel('cet4', this)">四级核心</button>
                <button class="filter-btn" onclick="setWordLevel('cet6', this)">六级核心</button>
            </div>
            <div class="word-display-box">
                <h3 id="wordDisplay" style="color: #8e44ad; font-size: 26px; margin-bottom: 8px;">abandon</h3>
                <p id="wordTranslation" style="color: #666; font-size: 15px; margin-bottom: 15px;">v. 放弃，抛弃</p>
                <button onclick="randomWord()" style="width: 80%; margin: 0 auto; background-color: #8e44ad;">换一个</button>
            </div>
        </div>
    </div>

    <script>
        // ====== 纯前端数据存储 (使用 LocalStorage) ======
        let todos = JSON.parse(localStorage.getItem('my_todos')) || [];
        let allExpenses = JSON.parse(localStorage.getItem('my_expenses')) || [];
        let messages = JSON.parse(localStorage.getItem('my_messages')) || [];
        
        let currentEmoji = '😄'; 
        let currentFilter = 'all'; 
        let currentCampus = '五山';
        let courses = []; 

        const campusFoods = {
            '五山': ["西区三楼 越南河粉", "西区三楼 冬阴功粉", "北一饭堂 烧腊双拼", "北一饭堂 潮汕粉面", "北二饭堂 麻辣香锅", "北二饭堂 辣子鸡", "西区二楼 广式早茶(虾饺)", "西区二楼 蒸凤爪", "西区四楼 手工水饺", "西区四楼 兰州拉面", "东区一饭 老上海云吞", "东区二饭 新疆大盘鸡", "南区饭堂 招牌螺蛳粉", "南区饭堂 东北锅包肉", "西区 鸡公煲", "北一 酸菜鱼", "东区一饭 铁板烧", "南区 烤肉拌饭", "西区 石锅拌饭", "东区 砂锅粥", "中区饭堂 传统小炒肉", "北二 黄焖鸡米饭"],
            '大学城': ["一饭 鱼片粥", "一饭 滑蛋饭", "一饭 烧腊饭", "一饭 东北饺子", "一饭 猪脚饭", "一饭 兰州拉面", "一饭 煲仔饭", "一饭 小炒肉", "一饭 烤肉拌饭", "一饭 麻辣烫", "二饭三楼 铁板饭", "二饭三楼 荷叶蒸饭", "二饭 石锅鸡", "二饭 烤鱼", "二饭 黄焖鸡", "二饭 酸菜鱼", "二饭 螺蛳粉", "二饭 香锅", "二饭 瓦罐汤", "二饭 砂锅粉", "二饭 猪肚鸡", "一饭 砂锅米线"],
            '国际': ["B1 韩式拌饭", "B1 焗饭", "B1 黑椒意面", "B1 日式咖喱饭", "B1 汉堡炸鸡套餐", "B1 酸菜鱼米饭", "B1 沙县小吃", "B1 铁板黑椒牛柳", "B1 台湾牛肉面", "B1 招牌盖浇饭", "F5 肠粉", "F5 云吞面", "F5 麻辣烫", "F5 烧腊饭", "F5 螺蛳粉", "F5 石锅拌饭", "F5 猪肚鸡", "F5 黄焖鸡", "F5 烤鱼饭", "F5 手工水饺", "B1 重庆小面", "F5 潮汕汤粉"]
        };

        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('todoDate').value = today;
            document.getElementById('expenseDate').value = today;
            renderTodos();
            renderExpenses();
            renderMessages();
            applyFilter();
            renderPomodoroLogs();
            renderMealLogs();
            renderWaterLogs(); 
            renderExams();
            randomWord(); 
            setInterval(renderExams, 60000);
        };

        function groupByDate(items) {
            return items.reduce((groups, item) => {
                const date = item.date || '未知日期';
                if (!groups[date]) groups[date] = [];
                groups[date].push(item);
                return groups;
            }, {});
        }

        // --- 待办 ---
        function addTodo() {
            const input = document.getElementById('todoInput');
            const dateInput = document.getElementById('todoDate').value;
            if (!input.value || !dateInput) return alert("请填写内容和日期！");
            todos.push({ id: Date.now().toString(), text: input.value, done: false, date: dateInput });
            localStorage.setItem('my_todos', JSON.stringify(todos));
            input.value = ''; renderTodos();
        }
        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) todo.done = !todo.done;
            localStorage.setItem('my_todos', JSON.stringify(todos));
            renderTodos();
        }
        function deleteTodo(id) {
            if(!confirm("确定删除吗？")) return;
            todos = todos.filter(t => t.id !== id);
            localStorage.setItem('my_todos', JSON.stringify(todos));
            renderTodos();
        }
        function renderTodos() {
            const sortedTodos = [...todos].sort((a, b) => new Date(b.date) - new Date(a.date));
            const grouped = groupByDate(sortedTodos);
            let html = '';
            for (const date in grouped) {
                html += `<div class="date-group"><div class="date-title">${date}</div><ul>`;
                html += grouped[date].map(todo => `
                    <li><span class="${todo.done ? 'todo-done' : ''}" style="cursor:pointer; flex:1;" onclick="toggleTodo('${todo.id}')">${todo.done ? '✅' : '⭕'} ${todo.text}</span>
                    <button class="delete-btn" onclick="deleteTodo('${todo.id}')">删除</button></li>
                `).join('');
                html += `</ul></div>`;
            }
            document.getElementById('todoContainer').innerHTML = html || '<p style="color:#aaa; text-align:center;">暂无计划</p>';
        }

        // --- 记账 ---
        function addExpense() {
            const name = document.getElementById('expenseName');
            const amount = document.getElementById('expenseAmount');
            const dateInput = document.getElementById('expenseDate').value;
            if (!name.value || !amount.value || !dateInput) return alert("请填写完整！");
            allExpenses.push({ id: Date.now().toString(), name: name.value, amount: Number(amount.value), date: dateInput });
            localStorage.setItem('my_expenses', JSON.stringify(allExpenses));
            name.value = ''; amount.value = ''; applyFilter();
        }
        function deleteExpense(id) {
            if(!confirm("确定删除这笔账单吗？")) return;
            allExpenses = allExpenses.filter(e => e.id !== id);
            localStorage.setItem('my_expenses', JSON.stringify(allExpenses));
            applyFilter();
        }
        function setFilter(type, btnElement) {
            currentFilter = type;
            document.querySelectorAll('.expense-filters .filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            applyFilter();
        }
        function applyFilter() {
            const today = new Date(); today.setHours(23, 59, 59, 999);
            let startDate = new Date(0);
            if (currentFilter === 'week') startDate = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
            else if (currentFilter === 'month') startDate = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
            else if (currentFilter === 'halfYear') startDate = new Date(today.getTime() - 180 * 24 * 60 * 60 * 1000);
            else if (currentFilter === 'year') startDate = new Date(today.getTime() - 365 * 24 * 60 * 60 * 1000);

            const filteredData = allExpenses.filter(exp => new Date(exp.date) >= startDate && new Date(exp.date) <= today);
            document.getElementById('filteredExpense').innerText = filteredData.reduce((sum, item) => sum + item.amount, 0).toFixed(2);
            document.getElementById('totalExpense').innerText = allExpenses.reduce((sum, item) => sum + item.amount, 0).toFixed(2);
            renderExpenses(filteredData);
        }
        function renderExpenses(expenses) {
            const grouped = groupByDate([...expenses].sort((a, b) => new Date(b.date) - new Date(a.date)));
            let html = '';
            for (const date in grouped) {
                html += `<div class="date-group"><div class="date-title">${date}</div><ul>`;
                html += grouped[date].map(exp => `
                    <li><span style="flex:1;">🍽️ ${exp.name}</span><span style="color:#e74c3c; margin-right:10px;">-￥${exp.amount}</span>
                    <button class="delete-btn" onclick="deleteExpense('${exp.id}')">删除</button></li>
                `).join('');
                html += `</ul></div>`;
            }
            document.getElementById('expenseContainer').innerHTML = html || '<p style="color:#aaa; text-align:center;">该区间暂无记录</p>';
        }

        // --- 碎碎念 ---
        function selectEmoji(emoji, element) {
            currentEmoji = emoji;
            document.querySelectorAll('.emoji-picker span').forEach(el => el.style.transform = 'scale(1)');
            element.style.transform = 'scale(1.5)';
        }
        function addMessage() {
            const text = document.getElementById('msgText');
            if (!text.value) return;
            messages.push({ id: Date.now().toString(), text: text.value, emoji: currentEmoji, time: new Date().toLocaleString() });
            localStorage.setItem('my_messages', JSON.stringify(messages));
            text.value = ''; renderMessages();
        }
        function renderMessages() {
            document.getElementById('messageList').innerHTML = [...messages].reverse().map(msg => `
                <div class="msg-item"><div class="msg-emoji">${msg.emoji}</div><div style="flex:1;"><div style="font-size: 14px; color: #333;">${msg.text}</div><div class="msg-time">${msg.time}</div></div></div>
            `).join('');
        }

        // --- 番茄钟 ---
        let defaultMinutes = 25;
        let timeLeft = defaultMinutes * 60;
        let timerInterval;
        let isRunning = false;

        function setPomodoroTime() {
            if (isRunning) return alert("请先暂停当前计时！");
            const min = parseInt(document.getElementById('customMinutes').value);
            if (isNaN(min) || min <= 0) return alert("请输入大于 0 的分钟数");
            defaultMinutes = min; timeLeft = min * 60; updateTimerDisplay();
            let logs = JSON.parse(localStorage.getItem('pomodoroLogs')) || [];
            logs.push(`[${new Date().toLocaleTimeString()}] 设定了 ${min} 分钟`);
            localStorage.setItem('pomodoroLogs', JSON.stringify(logs));
            renderPomodoroLogs(); document.getElementById('customMinutes').value = '';
        }
        function resetCurrentTimer() {
            if (isRunning) { clearInterval(timerInterval); isRunning = false; document.getElementById('timerBtn').innerText = "开始专注"; }
            timeLeft = defaultMinutes * 60; updateTimerDisplay();
        }
        function renderPomodoroLogs() {
            const logs = JSON.parse(localStorage.getItem('pomodoroLogs')) || [];
            document.getElementById('pomodoroLogs').innerHTML = logs.slice().reverse().map(log => `<div>${log}</div>`).join('') || '<div style="text-align:center; color:#ccc; font-size:12px;">暂无记录</div>';
        }
        function clearPomodoroLogs() {
            if (confirm("确定要清空所有番茄钟历史记录吗？")) { localStorage.removeItem('pomodoroLogs'); renderPomodoroLogs(); }
        }
        function updateTimerDisplay() {
            let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            document.getElementById('timerDisplay').innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
        }
        function startTimer() {
            const btn = document.getElementById('timerBtn');
            if (isRunning) { clearInterval(timerInterval); isRunning = false; btn.innerText = "继续专注"; return; }
            isRunning = true; btn.innerText = "暂停";
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) { 
                    clearInterval(timerInterval); alert("⏰ 时间到！休息一下吧！"); 
                    timeLeft = defaultMinutes * 60; isRunning = false; btn.innerText = "开始专注"; updateTimerDisplay();
                    let logs = JSON.parse(localStorage.getItem('pomodoroLogs')) || [];
                    logs.push(`[${new Date().toLocaleTimeString()}] 完成了一次 ${defaultMinutes} 分钟的专注！`);
                    localStorage.setItem('pomodoroLogs', JSON.stringify(logs)); renderPomodoroLogs(); return;
                }
                timeLeft--; updateTimerDisplay();
            }, 1000);
        }

        // --- 吃什么 & 伙食 ---
        function setCampus(campus, btnElement) {
            currentCampus = campus;
            document.querySelectorAll('.filter-group:not(.expense-filters):not(.word-filters) .filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            document.getElementById('foodResult').innerHTML = "点击抽取"; document.getElementById('foodResult').style.color = "#27ae60";
        }
        function pickFood() { 
            const list = campusFoods[currentCampus];
            const food = list[Math.floor(Math.random() * list.length)];
            document.getElementById('foodResult').innerHTML = `<span style="font-size: 14px; color: #7f8c8d;">${currentCampus}校区</span><br>${food}`;
            document.getElementById('foodResult').style.color = "#e67e22";
        }
        function addMealLog() {
            const input = document.getElementById('mealInput');
            if (!input.value.trim()) return alert("请输入你今天吃了什么！");
            const today = new Date().toISOString().split('T')[0];
            const time = new Date().toLocaleTimeString().slice(0, 5);
            let allMeals = JSON.parse(localStorage.getItem('mealLogs')) || [];
            allMeals.push({ date: today, time: time, text: input.value.trim() });
            localStorage.setItem('mealLogs', JSON.stringify(allMeals)); input.value = ''; renderMealLogs();
        }
        function renderMealLogs() {
            const today = new Date().toISOString().split('T')[0];
            const allMeals = JSON.parse(localStorage.getItem('mealLogs')) || [];
            const todayMeals = allMeals.filter(m => m.date === today);
            document.getElementById('mealLogList').innerHTML = todayMeals.length === 0 
                ? '<div style="font-size:12px; color:#aaa; text-align:center; margin-top:10px;">今天还没有记录哦~</div>'
                : todayMeals.slice().reverse().map(m => `
                    <div class="food-log-item"><span><span style="color:#3498db; font-weight:bold;">[${m.time}]</span> 🍜 ${m.text}</span>
                    <button class="delete-btn" onclick="deleteMealLog('${m.time}', '${m.text}')">删除</button></div>
                `).join('');
        }
        function deleteMealLog(time, text) {
            if(!confirm("确定删除吗？")) return;
            let allMeals = JSON.parse(localStorage.getItem('mealLogs')) || [];
            const index = allMeals.findIndex(m => m.date === new Date().toISOString().split('T')[0] && m.time === time && m.text === text);
            if (index !== -1) { allMeals.splice(index, 1); localStorage.setItem('mealLogs', JSON.stringify(allMeals)); renderMealLogs(); }
        }

        // --- 成绩计算 ---
        function addCourse() {
            const name = document.getElementById('courseName').value.trim() || "未命名课程";
            const credit = parseFloat(document.getElementById('creditInput').value);
            const score = parseFloat(document.getElementById('scoreInput').value);
            if (isNaN(credit) || isNaN(score) || credit <= 0 || score < 0 || score > 100) return alert("请输入有效的学分和分数 (0-100)！");
            courses.push({ name, credit, score });
            document.getElementById('courseName').value = ''; document.getElementById('creditInput').value = ''; document.getElementById('scoreInput').value = ''; renderCourses();
        }
        function scoreToGpa(score) {
            if (score >= 90) return 4.0; if (score >= 85) return 3.7; if (score >= 82) return 3.3;
            if (score >= 78) return 3.0; if (score >= 75) return 2.7; if (score >= 71) return 2.3;
            if (score >= 66) return 2.0; if (score >= 62) return 1.7; if (score >= 60) return 1.3;
            return 0.0;
        }
        function renderCourses() {
            let totalCredit = 0, totalScore = 0, totalGpaPoints = 0, html = '';
            [...courses].reverse().forEach((c, i) => {
                const realIndex = courses.length - 1 - i;
                const gpa = scoreToGpa(c.score);
                totalCredit += c.credit; totalScore += (c.credit * c.score); totalGpaPoints += (c.credit * gpa); 
                html += `<div class="history-item"><span>📘 ${c.name} (${c.credit}学分)</span><span>${c.score}分 (绩点:${gpa}) <span style="color:red;cursor:pointer; margin-left:8px;" onclick="removeCourse(${realIndex})">[x]</span></span></div>`;
            });
            document.getElementById('courseList').innerHTML = html || '<div style="color:#aaa; text-align:center;">请添加课程成绩</div>';
            document.getElementById('totalCredits').innerText = totalCredit;
            document.getElementById('weightedAvg').innerText = totalCredit === 0 ? "0.00" : (totalScore / totalCredit).toFixed(2);
            const gpa = totalCredit === 0 ? 0 : (totalGpaPoints / totalCredit);
            document.getElementById('gpaDisplay').innerText = gpa.toFixed(2);
        }
        function removeCourse(index) { courses.splice(index, 1); renderCourses(); }

        // --- 喝水打卡 ---
        function changeWater(amount) {
            const today = new Date().toISOString().split('T')[0];
            let waterLogs = JSON.parse(localStorage.getItem('waterLogs')) || {};
            if (!waterLogs[today]) waterLogs[today] = 0;
            waterLogs[today] += amount; if (waterLogs[today] < 0) waterLogs[today] = 0; 
            localStorage.setItem('waterLogs', JSON.stringify(waterLogs)); renderWaterLogs();
        }
        function renderWaterLogs() {
            const today = new Date().toISOString().split('T')[0];
            let waterLogs = JSON.parse(localStorage.getItem('waterLogs')) || {};
            document.getElementById('waterCount').innerText = waterLogs[today] || 0;
            let html = ''; const dates = Object.keys(waterLogs).sort((a,b) => new Date(b) - new Date(a)).slice(0, 7); 
            if (dates.length === 0) { html = '<div style="color:#aaa; text-align:center;">暂无记录</div>'; } 
            else {
                dates.forEach(date => {
                    const isToday = date === today ? ' (今天)' : '';
                    html += `<div class="history-item"><span>${date}${isToday}</span><span style="color:#3498db; font-weight:bold;">${waterLogs[date]} 杯</span></div>`;
                });
            }
            document.getElementById('waterLogList').innerHTML = html;
        }

        // --- 考试倒计时 ---
        function addExam() {
            const name = document.getElementById('examName').value.trim();
            const time = document.getElementById('examTime').value;
            if (!name || !time) return alert("请填写科目名称和考试时间！");
            let exams = JSON.parse(localStorage.getItem('examLogs')) || [];
            exams.push({ id: Date.now().toString(), name: name, time: time });
            localStorage.setItem('examLogs', JSON.stringify(exams));
            document.getElementById('examName').value = ''; document.getElementById('examTime').value = ''; renderExams();
        }
        function deleteExam(id) {
            if (!confirm("确定删除这个科目的倒计时吗？")) return;
            let exams = JSON.parse(localStorage.getItem('examLogs')) || [];
            exams = exams.filter(e => e.id !== id); localStorage.setItem('examLogs', JSON.stringify(exams)); renderExams();
        }
        function renderExams() {
            let exams = JSON.parse(localStorage.getItem('examLogs')) || [];
            const container = document.getElementById('examList');
            if (exams.length === 0) { container.innerHTML = '<div style="color:#aaa; text-align:center;">还没有添加考试哦~</div>'; return; }
            exams.sort((a, b) => new Date(a.time) - new Date(b.time));
            const now = new Date().getTime(); let html = '';
            exams.forEach(exam => {
                const examTime = new Date(exam.time).getTime(); const diff = examTime - now;
                const dateStr = exam.time.replace('T', ' '); let countdownText = ''; let isExpired = false;
                if (diff <= 0) { countdownText = "已开考/已结束"; isExpired = true; } 
                else {
                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    if (days > 0) { countdownText = `剩 ${days} 天 ${hours} 小时`; } 
                    else if (hours > 0) { countdownText = `剩 ${hours} 小时 ${minutes} 分`; } 
                    else { countdownText = `剩 ${minutes} 分钟！`; }
                }
                html += `<div class="exam-item"><div class="exam-header"><span class="exam-name">📚 ${exam.name}</span><button class="delete-btn" onclick="deleteExam('${exam.id}')">删除</button></div><div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;"><span class="exam-time">${dateStr}</span><span class="exam-countdown ${isExpired ? 'expired' : ''}">${countdownText}</span></div></div>`;
            });
            container.innerHTML = html;
        }

        // --- 背单词 ---
        let currentWordLevel = 'cet4';
        const cet4Words = [{ en: "abandon", cn: "v. 放弃，抛弃" }, { en: "academic", cn: "adj. 学术的" }, { en: "benefit", cn: "n. 利益" }, { en: "crucial", cn: "adj. 至关重要的" }, { en: "dedicate", cn: "v. 奉献" }, { en: "efficient", cn: "adj. 高效的" }];
        const cet6Words = [{ en: "abolish", cn: "v. 废除" }, { en: "abrupt", cn: "adj. 突然的" }, { en: "absurd", cn: "adj. 荒谬的" }, { en: "abundant", cn: "adj. 丰富的" }, { en: "accessory", cn: "n. 配件" }, { en: "acclaim", cn: "v. 称赞" }];
        
        // 为了不让代码太长，这里只放了几个示例单词，你需要保留你原本的长单词表
        function setWordLevel(level, btnElement) {
            currentWordLevel = level;
            document.querySelectorAll('.word-filters .filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active'); randomWord();
        }
        function randomWord() {
            const wordList = currentWordLevel === 'cet4' ? cet4Words : cet6Words;
            const randomIndex = Math.floor(Math.random() * wordList.length);
            document.getElementById('wordDisplay').innerText = wordList[randomIndex].en;
            document.getElementById('wordTranslation').innerText = wordList[randomIndex].cn;
        }
    </script>
</body>
</html>
